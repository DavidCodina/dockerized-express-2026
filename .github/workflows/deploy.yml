name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm"
        required: true
        default: ''

# ❓ But is there a way to manually deploy a Docker image directly?
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional: Restrict this workflow to only run when dispatched against the development branch
    # if: github.ref == 'refs/heads/development'
    steps:
      - name: Guard confirmation input
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "Confirmation input did not match 'deploy'. Aborting."
          exit 1

      # Two ways to trigger a Render deploy from Actions: a deploy hook URL (simplest — just a POST request)
      # or the Render API (needs an API key + service ID, but lets you poll for deploy status).
      - name: Trigger Render deploy hook
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
