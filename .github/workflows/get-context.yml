name: Get Context

on:
  workflow_dispatch:

jobs:
  context:
    runs-on: ubuntu-latest
    env:
      FAVORITE_LANGUAGE: Python
      LEAST_FAVORITE_LANGUAGE: YAML

    steps:
      - name: Dump GitHub Context
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Dump Env Context
        env:
          ENV_CONTEXT: ${{ toJSON(env) }}
        run: echo "$ENV_CONTEXT"

      # vars are created in the repo itself at Settings → Secrets and variables → Actions → Variables tab
      # They are used for non-sensitive configuration data — things you wouldn't mind someone seeing.
      # Examples: environment name (staging/production), a default region (us-east-1), a feature flag, a build target.
      # They show up fully readable in logs if you echo them — no masking.
      - name: Dump Vars Context
        env:
          VARS_CONTEXT: ${{ toJSON(vars) }}
        run: echo "$VARS_CONTEXT"

      - name: Dump Job Context
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: echo "$JOB_CONTEXT"

      - name: Dump Runner Context
        env:
          RUNNER_CONTEXT: ${{ toJSON(runner) }}
        run: echo "$RUNNER_CONTEXT"

      - name: Dump Steps Context
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
        run: echo "$STEPS_CONTEXT"
