name: Playground

on:
  push:
    branches: [development]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Deps
        run: npm ci

      # - name: Type Check
      #   run: npm run typescript

      - name: Lint
        # The current package.json `npm run lint` script will not cause the CI step to fail on warnings.
        # However, in the actual CI we want it to, so we use --max-warnings=0
        # ❌ run: npm run lint
        run: npx eslint src --max-warnings=0
