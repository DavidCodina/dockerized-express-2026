name: Dockerized CI
on:
  workflow_dispatch:

jobs:
  dockerized-test:
    runs-on: ubuntu-latest
    container: #* New...
      image: node:26-alpine3.23 #* New...

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # - name: Use Node
      #   uses: actions/setup-node@v5
      #   with:
      #     node-version: 24
      #     cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --config ./prisma.config.ts
        env:
          DATABASE_URL: postgresql://dummy_user:dummy_password@localhost:5432/dummy_db

      - name: ⚡️ TypeScript Check
        run: npm run typescript

      - name: ⚡️ Lint
        run: npx eslint src --max-warnings=0

      - name: ⚡️ Run Tests
        run: npm run test:run

#--------------------------------------------------------------------------
#
# Running CI in an environment that matches production more closely is generally the right call here.
# A few reasons this is worth it, plus a couple of caveats to be aware of:
#
#   - Catches environment-specific bugs earlier. If your Dockerfile uses node:26-alpine3.23,
#   any issue caused by Alpine's musl libc (vs. glibc on the default ubuntu-latest runner),
#   missing system packages, or subtle native-module incompatibilities will now surface in CI instead of only showing up after deploy to Render.
#
#   - Version drift prevention. Previously, the CI was testing against Node 24 while prod deploys on
#   Node 26 baked into the image — that's exactly the kind of mismatch that leads to "works in CI,
#   breaks in prod" surprises. Aligning them removes that gap.
#
#   - Prisma binary targets. Prisma generates engine binaries specific to the OS/libc combo.
#   Testing on the same base image means you're validating the actual binary target that will
#   run in production, not a different one that happens to also work.
#
#   - Reproducibility. If a bug ever comes up in production, you can debug against a CI environment
#   that's a much closer stand-in, rather than accounting for two different Node/OS combinations.
#
#--------------------------------------------------------------------------
