name: dev_express_psql # Compose enforces lowercase for project names.
services:
  api:
    depends_on:
      db:
        # This only works in compose version >= 2.3 and < 3.0
        condition: service_healthy
    build:
      context: .
      # target: development tells Docker "stop building once you've completed the stage named development".
      # and that name is resolved by literally matching against the AS <name> labels in your Dockerfile.
      # It's a plain string lookup, nothing more clever than that.
      target: development
      # dockerfile: Dockerfile.dev
    container_name: NODE_CONTAINER
    # This will run whenever you do `docker compose up --watch`. In other words, whenever you initialize a new container.
    # However, the logic for running migrations (i.e., `npx prisma migrate deploy`) will NOT run every time the application
    # code changes then is saved then sync+restart.
    entrypoint: ['/app/docker-entrypoint.sh']
    command: ['npm', 'run', 'dev']
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env
    volumes:
      ## Is there any reason why we can't do - .:/app:ro ?
      - .:/app
      #--------------------------------------------------------------------------
      #
      # Without this, .:/app would also mount your host node_modules into the Linux container. That causes
      # problems because native packages (node-gyp, esbuild, Prisma, etc.) are compiled for macOS on your machine
      # The container runs Linux and needs Linux binaries.  See here for more info:
      #
      #   https://www.udemy.com/course/docker-mastery-for-nodejs/learn/lecture/13970472#overview
      #
      # Note: some examples use an anonymous volue: - /app/node_modules
      # However, it's a better practice to use a named volume.
      #
      #--------------------------------------------------------------------------
      - node_modules:/app/node_modules
      # ❌ - ./prisma:/app/prisma

    #--------------------------------------------------------------------------
    #
    # Previously I was doing this, plus the above ./prisma:/app/prisma
    # The develop/watch solution would resync when application code changed.
    # However, if we had a separate test watcher running withing the container,
    # it would not get retriggered:
    #
    #   docker exec -it NODE_CONTAINER npm run test
    #
    # For whatever reason, that resync process doesn't communicate with the already-running
    # Vitest watcher. Stephen Grider explains this exact issue here:
    #
    #   https://www.udemy.com/course/docker-and-kubernetes-the-complete-guide/learn/lecture/11437080#overview
    #
    #------------------------
    #
    # What happens when we change package.json install new dependencies?
    # When you change package.json or package-lock.json, run install inside the container once
    # (or is npm ci prefereable).
    #
    #   docker exec -it NODE_CONTAINER npm install
    #
    # Or rebuild if you prefer a clean slate:
    #
    # docker compose -f docker-compose.dev.yaml up --build
    #
    #------------------------
    #
    # Why Does develop.watch Exists At All?
    #
    # It's useful when you don't bind-mount source — e.g. you want the container
    # filesystem isolated and only push specific paths in.
    #
    #--------------------------------------------------------------------------

    # ❌ develop:
    #   watch:
    #     - action: sync+restart
    #       path: ./src
    #       target: /app/src
    #     - action: rebuild
    #       path: ./docker-entrypoint.sh
    #     - action: rebuild
    #       path: ./package.json
    #     - action: rebuild
    #       path: ./package-lock.json
    #     - action: rebuild
    #       path: ./prisma/schema.prisma
    #     - action: rebuild
    #       path: ./prisma.config.ts
    #     - action: rebuild
    #       path: ./tsconfig.json

  db:
    # Using postgres is much more convenient than MySQL because cloud providers
    # like render.com and neon.com only support Postgres.
    image: postgres:latest
    container_name: POSTGRES_CONTAINER
    ## Do we even need restart if we're already using depends_on + service_healthy?
    restart: unless-stopped # Or: always - the default is off.
    environment:
      POSTGRES_USER: docker_user
      POSTGRES_PASSWORD: docker_password
      POSTGRES_DB: docker_db
    # This is not needed for the api to communicate wit the db.
    # That connection happens over Docker's internal network, where containers
    # can reach each other by service name. This would only be important if you wanted
    # to use PgAdmin on your host machine.
    ports:
      - '5432:5432'
    volumes:
      #--------------------------------------------------------------------------
      #
      # The official Postgres image's actual data directory is /var/lib/postgresql/data
      # However, I was running into issues with that.
      #
      #   ❌ - pgdata:/var/lib/postgresql/data
      #
      # Postgres 17→18 changed how the official image lays out data on disk, and the image's own
      # error message says it directly: the suggested container configuration for 18+ is to place
      # a single mount at /var/lib/postgresql, which will then place PostgreSQL data in a subdirectory,
      # rather than mounting /var/lib/postgresql/data directly like older versions.
      #
      # Note also that this is a named volume and NOT a bind mount (i.e., does NOT start with / or ./).
      #
      #--------------------------------------------------------------------------
      - pgdata:/var/lib/postgresql

      #--------------------------------------------------------------------------
      #
      #  /docker-entrypoint-initdb.d is a special convention, but it's not a Docker feature itself.
      # It's baked into the official postgres image's startup script, not Docker as a platform.
      # In other words, it has more to do with the official postgres Docker image implementation details.
      # - ./init:/docker-entrypoint-initdb.d
      #
      #--------------------------------------------------------------------------

    # Not also that the real long-term solution is to build waits and restarts into the Express application's database.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docker_user -d docker_db']
      #! test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      # start_period gives the container a grace window after startup where
      # failed checks don't count against `retries` (they're not counted as
      # failures at all, and don't trigger "unhealthy" status). Once
      # start_period elapses, failures start counting normally. This is
      # meant to cover slow/variable startup work, not steady-state hiccups.
      #!  start_period: 5s
volumes:
  node_modules:
  pgdata:

#--------------------------------------------------------------------------
#
# To access the database when the container is running do this:
#
#   docker exec -it POSTGRES_CONTAINER psql -U docker_user -d docker_db
#   SELECT id, title, body FROM posts;
#
# This should also work:
#
#   docker compose exec db psql -U docker_user -d docker_db
#
#--------------------------------------------------------------------------
