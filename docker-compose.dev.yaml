services:
  api:
    build:
      context: .
      # target: development tells Docker "stop building once you've completed the stage named development".
      # and that name is resolved by literally matching against the AS <name> labels in your Dockerfile.
      # It's a plain string lookup, nothing more clever than that.
      target: development
    container_name: NODE_CONTAINER
    command: ['npm', 'run', 'dev']
    ports:
      - '${PORT}:${PORT}'
      # - '5000:5000'
    env_file:
      - .env
    volumes:
      - node_modules:/app/node_modules
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./tsconfig.json
volumes:
  node_modules:
